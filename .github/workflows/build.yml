name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Paper 26.2 / Java 25
            java: '25'
            profile: ''
          - name: Paper 1.21.11 / Java 21
            java: '21'
            profile: '-Pcompat-1.21.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test and package
        run: ./mvnw --batch-mode ${{ matrix.profile }} clean verify
      - name: Upload plugin jar
        if: matrix.java == '25'
        uses: actions/upload-artifact@v4
        with:
          name: PlasmoParrots
          path: target/PlasmoParrots-*.jar
          if-no-files-found: error
